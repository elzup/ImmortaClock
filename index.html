<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImmortaClock</title>
<style>
  :root {
    --fg: #1a1a1a; --bg: #f7f7f4; --muted: #6b6b6b; --line: #ddd;
    --danger: #c0392b; --warn: #b9770e; --safe: #1e7d4f; --link: #2a6fb0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem; color: var(--fg); background: var(--bg);
    font-family: system-ui, -apple-system, sans-serif; line-height: 1.5;
  }
  main { max-width: 880px; margin: 0 auto; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  h1 { font-size: 1rem; font-weight: 600; color: var(--muted); margin: 0 0 .25rem; letter-spacing: .05em; }
  #lang { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: .2rem .6rem; }
  /* clamp() 非対応ブラウザ向けに前置の固定値フォールバック (degrade) */
  #clock { font-size: 4rem; font-size: clamp(2rem, 9vw, 4.5rem); font-weight: 700; margin: 0; }
  #clock { font-variant-numeric: tabular-nums; }
  #effective { margin: .5rem 0 .25rem; font-size: 1.05rem; }
  #effective strong { color: var(--safe); }
  #effective .lim { color: var(--warn); }
  #accuracy { margin: 0 0 1rem; font-size: .9rem; color: var(--muted); }
  section { margin-top: 1.75rem; }
  h2 { font-size: .95rem; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: .3rem; margin: 0 0 .25rem; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: .5rem .4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  a { color: var(--link); }
  td.years { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
  .danger td.years { color: var(--danger); }
  .warn td.years { color: var(--warn); }
  .safe td.years { color: var(--safe); }
  tr.muted td { color: var(--muted); }
  tr.muted td.years { font-style: italic; font-weight: 400; }
  .basis { font-size: .8rem; color: var(--muted); }
  .note { font-size: .78rem; color: var(--muted); margin-top: .15rem; }
  .badge { font-size: .72rem; border: 1px solid var(--line); border-radius: 999px; padding: .05rem .55rem; white-space: nowrap; }
  .state.active { color: var(--fg); }
  .state.escaped { color: var(--safe); border-color: var(--safe); }
  .state.na { color: var(--muted); }
  .tier-core { color: var(--safe); border-color: var(--safe); font-weight: 600; }
  .tier-enhanced { color: var(--warn); }
  .tier-dev { color: var(--muted); }
  .dist-active { color: var(--safe); border-color: var(--safe); }
  .dist-planned { color: var(--warn); }
  .dist-candidate { color: var(--muted); }
  td.api { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .82rem; }
  td.deps { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .78rem; color: var(--muted); white-space: nowrap; }
  .risk-low { color: var(--safe); font-weight: 600; }
  .risk-med { color: var(--warn); font-weight: 600; }
  .risk-high { color: var(--danger); font-weight: 600; }
  td.no { color: var(--muted); }
  footer { margin-top: 2rem; font-size: .75rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>ImmortaClock</h1>
    <button id="lang" type="button" aria-label="language"></button>
  </div>
  <p id="clock">--------------------</p>
  <p id="effective"></p>
  <p id="accuracy"></p>

  <section>
    <h2 id="stackTitle"></h2>
    <table><thead><tr id="stackHead"></tr></thead><tbody id="layers"></tbody></table>
  </section>
  <section>
    <h2 id="featTitle"></h2>
    <table><thead><tr id="featHead"></tr></thead><tbody id="feat"></tbody></table>
  </section>
  <section>
    <h2 id="distTitle"></h2>
    <table><thead><tr id="distHead"></tr></thead><tbody id="dist"></tbody></table>
  </section>
  <section>
    <h2 id="apiTitle"></h2>
    <table><thead><tr id="apiHead"></tr></thead><tbody id="api"></tbody></table>
  </section>
  <section>
    <h2 id="devTitle"></h2>
    <table><thead><tr id="devHead"></tr></thead><tbody id="dev"></tbody></table>
  </section>

  <footer id="footer"></footer>
</main>

<script>
(function (root) {
  "use strict";

  // ============================================================
  // 純粋ロジック層 (DOM 非依存・テスト対象)
  //  ES5 構文のみ (var/function。const/let/arrow/template literal は不使用)。
  //  理由: {ES5可エンジン} は {ES2015可} の上位集合 → 寿命が ≥ になる
  //  (design:hosting-redundancy の min→max 原理を実行基盤レイヤへ適用 / INV-SF-4)。
  // ============================================================

  // --- i18n (design:i18n) ---
  function t(loc, lang) {
    if (!loc) return "";
    if (loc[lang] != null) return loc[lang];
    if (loc.ja != null) return loc.ja;
    return loc.en != null ? loc.en : "";
  }
  function L(ja, en) { return { ja: ja, en: en }; }

  // --- spec:clock: 時刻整形 (Date のみ。Temporal/Intl/polyfill 不使用) ---
  function pad2(n) { return n < 10 ? "0" + n : String(n); }
  function format(date) {
    return date.getFullYear() + "-" + pad2(date.getMonth() + 1) + "-" + pad2(date.getDate()) +
      " " + pad2(date.getHours()) + ":" + pad2(date.getMinutes()) + ":" + pad2(date.getSeconds());
  }

  // --- spec:longevity: 年数の人間可読化 ---
  function stripZero(s) { return s.replace(/\.0$/, ""); }
  function humanizeYears(n, lang) {
    if (!isFinite(n)) return "∞";
    if (lang === "en") {
      if (n >= 1000000) return stripZero((n / 1000000).toFixed(1)) + "M yr";
      if (n >= 1000) return Math.round(n / 1000) + "k yr";
      return n + " yr";
    }
    if (n >= 10000) return stripZero((n / 10000).toFixed(1)) + "万年";
    return n + "年";
  }

  // --- design:layers: JS Date 数値上限 (TZ 非依存) ---
  var DATE_MAX_MS = 8640000000000000; // new Date(±8.64e15) が有効上限
  function dateLimitYear() { return new Date(DATE_MAX_MS).getUTCFullYear(); } // -> 275760

  // --- design:i18n: UI 文言 ---
  var UI = {
    // 表1: 全レイヤ統合 (依存中→脱却→該当なし)
    stackTitle: L("依存スタックと寿命診断（依存中 → 脱却 → 該当なし）", "Dependency stack & longevity (active → escaped → N/A)"),
    colLayer: L("依存レイヤ", "Layer"),
    colState: L("状態", "State"),
    colKiller: L("何が壊すか", "What breaks it"),
    colYears: L("あと何年", "Years left"),
    colBasis: L("推定根拠", "Estimation basis"),
    statusActive: L("依存中", "active"),
    // 表5: 機能別の寿命・必須度
    featTitle: L("機能別の寿命・必須度（最低限 時計が動けばよい）", "Per-feature longevity & criticality (clock is the irreducible core)"),
    colFeature: L("機能", "Feature"),
    colTier: L("必須度", "Criticality"),
    colSurvive: L("朽ちても時計は動く?", "Clock survives if it rots?"),
    colDeps: L("spec依存数", "spec deps"),
    // 表6: 配布の冗長化
    distTitle: L("配布の冗長化（無料・独立先を併用 → min から max へ）", "Distribution redundancy (free, independent targets → min to max)"),
    colTarget: L("配布先", "Target"),
    colKind: L("種別", "Kind"),
    colOperator: L("運営", "Operator"),
    colCost: L("コスト", "Cost"),
    colStatus: L("状態", "Status"),
    // 表3: 使用 API リスク
    apiTitle: L("使用APIとレガシー化リスク", "Used APIs & obsolescence risk"),
    colApi: L("API / 機能", "API / feature"),
    colSince: L("導入時期", "Since"),
    colAdoption: L("普及", "Adoption"),
    colRisk: L("リスク", "Risk"),
    colDegrade: L("degrade（劣化動作）", "Degrade"),
    // 表4: 開発時依存
    devTitle: L("開発時の依存（配布物には非搭載）", "Dev-time dependencies (not shipped)"),
    colTool: L("ツール", "Tool"),
    colUse: L("用途", "Purpose"),
    colShipped: L("配布物に含む", "Shipped"),
    // サマリ
    effPrefix: L("描画が続く実効寿命: ", "Effective lifespan (keeps rendering): "),
    effLim: L("律速: ", "limited by: "),
    effNone: L("律速なし（依存はすべて恒久）", "No limiter (all dependencies effectively permanent)"),
    accPrefix: L("正確な地域時刻の寿命: ", "Accurate local-time horizon: "),
    accNone: L("精度の律速なし", "No accuracy limiter"),
    // 値ラベル
    basisComputable: L("計算可能", "computable"),
    basisHeuristic: L("推定", "estimated"),
    statusEscaped: L("脱却", "escaped"),
    statusNa: L("該当なし", "not applicable"),
    tier: { core: L("核", "core"), enhanced: L("付加", "enhanced"), dev: L("開発時", "dev-only") },
    distStatus: { active: L("稼働", "active"), planned: L("予定", "planned"), candidate: L("候補", "candidate") },
    risk: { low: L("低", "low"), med: L("中", "med"), high: L("高", "high") },
    conf: { low: L("信頼度低", "low conf."), medium: L("信頼度中", "med conf."), high: L("信頼度高", "high conf.") },
    shippedNo: L("いいえ", "No"),
    footer: L(
      "単一HTMLファイル・ビルド無し・外部依存無しで動作（file:// 可）。ES5構文で実行基盤を最大化。表は依存スタック（状態つき）／機能別寿命／配布冗長化／APIリスク／開発時依存。",
      "Single HTML file, no build, no external deps (works via file://). ES5 syntax maximizes the runnable-engine set. Tables: dependency stack (with state) / per-feature longevity / distribution redundancy / API risk / dev-time deps."
    )
  };

  // --- design:layers: 依存レイヤの単一真実源 ---
  //  status: 'active'(依存中) | 'escaped'(意図的に脱却) | 'na'(該当なし) … 依存状態の軸
  //  kind:   'computable' | 'heuristic'                                … 推定根拠の軸 (status と直交)
  //  impact: 'fatal'(描画停止) | 'accuracy'(動くが不正確) | 'cosmetic'(軽微)
  var LAYERS = [
    // --- 依存中 (active): 脆い → 堅牢 ---
    { id: "host", status: "active", impact: "fatal", kind: "heuristic", estimatedYears: 5, confidence: "low",
      label: L("ホスティング / ファイル存在", "Hosting / file existence"),
      killer: L("課金切れ・業者終了・バックアップ喪失", "Billing lapse, provider shutdown, lost backups"),
      note: L("冗長化が鍵: 無料の独立配布先(GitHub/Cloudflare Pages, GitLab/Codeberg ミラー)+ オフライン複製を併用すれば、寿命は『最短』でなく『最長まで生き残るミラー』で決まる(下の配布表)。",
             "Redundancy is key: with free independent targets (GitHub/Cloudflare Pages, GitLab/Codeberg mirrors) plus offline copies, lifespan is set by the longest-surviving mirror, not the shortest (see distribution table).") },
    { id: "browser", status: "active", impact: "fatal", kind: "heuristic", estimatedYears: 30, confidence: "medium",
      label: L("ブラウザ / JSエンジン (vanilla ES)", "Browser / JS engine (vanilla ES)"),
      killer: L("後方互換の打ち切り（歴史上ほぼ前例なし）", "Dropping backward compatibility (almost no precedent)") },
    { id: "tz", status: "active", impact: "accuracy", kind: "heuristic", estimatedYears: 40, confidence: "medium",
      label: L("IANA タイムゾーンDB", "IANA time zone DB"),
      killer: L("tz更新の停止・地政学的変更", "tz updates stopping; geopolitical changes"),
      note: L("更新が止まると地域時刻がズレる（動くが不正確化）。", "If updates stop, local time drifts (it runs but grows inaccurate).") },
    { id: "time-api", status: "active", impact: "fatal", kind: "heuristic", estimatedYears: 50, confidence: "high",
      label: L("時刻API (Date)", "Time API (Date)"),
      killer: L("Date廃止（可能性ほぼ無し）", "Removal of Date (virtually impossible)"),
      note: L("Dateは後方互換で恒久。Temporalはpolyfillが依存を焼き込むため不使用、nativeに普及してもDateを維持。",
             "Date is permanent via backward compat. Temporal is avoided (a polyfill would bake in a dependency); even once native, this app keeps Date.") },
    { id: "html", status: "active", impact: "fatal", kind: "heuristic", estimatedYears: 50, confidence: "high",
      label: L("HTML / CSS 規格", "HTML / CSS standards"),
      killer: L("後方互換の文化が崩れる", "The culture of backward compatibility breaking") },
    { id: "encoding", status: "active", impact: "fatal", kind: "heuristic", estimatedYears: 300, confidence: "high",
      label: L("数値・文字 (IEEE754 / Unicode)", "Numbers & text (IEEE754 / Unicode)"),
      killer: L("事実上不変", "Effectively immutable") },
    { id: "physical", status: "active", impact: "fatal", kind: "heuristic", estimatedYears: 300, confidence: "low",
      label: L("電力・デバイス・文明", "Power, devices, civilization"),
      killer: L("物理基盤の喪失", "Loss of the physical substrate"),
      note: L("本ソフトの範囲外だが最終的な律速。The Long Now 的観点。", "Out of this software's scope, but the ultimate limiter — a Long Now perspective.") },
    { id: "date-limit", status: "active", impact: "fatal", kind: "computable", failureYear: dateLimitYear,
      label: L("JS Date 数値上限", "JS Date numeric limit"),
      killer: L("new Date(8.64e15) を超過", "Exceeding new Date(8.64e15)"),
      note: L("倍精度ミリ秒の天井。西暦 " + dateLimitYear() + " 年まで表現可能。", "Ceiling of double-precision ms. Representable until year " + dateLimitYear() + ".") },

    // --- 脱却 (escaped): 依存し得たが意図的に回避 (反実仮想で年数を提示) ---
    { id: "framework", status: "escaped", impact: "fatal", kind: "heuristic", estimatedYears: 5, confidence: "low",
      label: L("モダンFW / ビルド / CDN", "Modern framework / build / CDN"),
      killer: L("major破壊変更・パッケージ消失", "Breaking major releases, vanished packages"),
      aside: L("単一HTMLに内包・ビルド無し・CDN参照無しで回避。", "Avoided: inlined in one HTML, no build step, no CDN reference.") },
    { id: "tls", status: "escaped", impact: "cosmetic", kind: "heuristic", estimatedYears: 15, confidence: "medium",
      label: L("TLS / HTTPS", "TLS / HTTPS"),
      killer: L("旧プロトコルの廃止", "Deprecation of old protocols"),
      aside: L("file:// では不要。HTTPに落ちても読み込めれば描画は継続。", "Not needed on file://; even falling back to HTTP it keeps rendering once loaded.") },
    { id: "persistent-state", status: "escaped", impact: "cosmetic", kind: "heuristic", estimatedYears: 20, confidence: "medium",
      label: L("永続ストレージ (localStorage/Cookie)", "Persistent storage (localStorage/Cookie)"),
      killer: L("ストレージAPIの変更・消去・権限制限", "Storage API changes, clearing, permission restrictions"),
      aside: L("ステートレス設計で不使用（INV-SF-5）。言語選択も揮発。", "Stateless by design (INV-SF-5); the language choice is volatile too.") },

    // --- 該当なし (na): 外部の時刻問題だが本アプリには非該当 (情報) ---
    { id: "leap-second", status: "na", impact: "cosmetic", kind: "computable", failureYear: function () { return 2035; },
      label: L("うるう秒の廃止", "Abolition of leap seconds"),
      killer: L("IERSによるうるう秒運用の終了", "IERS ending leap-second insertion"),
      aside: L("UTC定義の変更。壁掛け時計の表示には実質無影響。", "A change to UTC; practically no effect on a wall clock.") },
    { id: "time-t-2038", status: "na", impact: "cosmetic", kind: "computable", failureYear: function () { return 2038; },
      label: L("符号付き32bit time_t (2038問題)", "Signed 32-bit time_t (Y2038)"),
      killer: L("time_t の桁あふれ", "time_t overflow"),
      aside: L("JSは倍精度で時刻を保持するため本アプリは無関係。OS/組込み層の話。", "JS holds time as a double, so this app is unaffected; concerns OS/embedded layers.") }
  ];

  // --- design:feature-longevity: 機能別の寿命・必須度 ---
  //  deps = 推移的 spec 依存数 (ceg.mjs deps と一致 / coherence)。少=頑健・長命。
  var FEATURES = [
    { specId: "spec:clock", tier: "core", deps: 1,
      label: L("時計表示", "Clock display"),
      survives: L("これが核。停止＝失敗。依存が最少で最長命。", "The core. If it stops we failed; fewest deps, longest-lived.") },
    { specId: "design:i18n", tier: "enhanced", deps: 1,
      label: L("多言語 (ja/en)", "i18n (ja/en)"),
      survives: L("動く。時刻はISO数値で言語非依存(REQ-I18N-1)、ラベルが片言語化するだけ。", "Yes — time is language-neutral ISO numerals (REQ-I18N-1); only labels degrade to one language.") },
    { specId: "spec:longevity", tier: "enhanced", deps: 4,
      label: L("寿命エンジン", "Longevity engine"),
      survives: L("動く。あと何年の数値が出なくなるだけ。", "Yes — only the years-left numbers disappear.") },
    { specId: "spec:diagnosis-ui", tier: "enhanced", deps: 9,
      label: L("自己診断UI（各表）", "Self-diagnosis UI (tables)"),
      survives: L("動く。表が消えても時計はチックし続ける。最も依存が多い=最も脆い。", "Yes — even if the tables vanish, the clock keeps ticking. Most deps = most fragile.") },
    { specId: "design:dev-deps", tier: "dev", deps: 2,
      label: L("テスト / CEG", "Tests / CEG"),
      survives: L("配布物に非搭載。実行時の時計には無関係。", "Not shipped; irrelevant to the running clock.") }
  ];

  // --- design:hosting-redundancy: 配布の冗長化 (無料・独立先) ---
  // REQ-HOST-5: 稼働(active)配布先は url を持ち、ページ上に相互リンクを掲示する
  // (自己記述的冗長化: どのミラーに辿り着いても他の生存先を発見できる)。
  var DISTRIBUTION = [
    { target: "GitHub Pages", status: "active",
      url: "https://elzup.github.io/ImmortaClock/",
      kind: L("Pages配布 + repo", "Pages + repo"),
      operator: L("Microsoft", "Microsoft"), cost: L("無料", "Free") },
    { target: "Cloudflare Workers", status: "active",
      url: "https://immorta-clock.anozon.workers.dev/",
      kind: L("Workers (静的配信)", "Workers (static)"),
      operator: L("Cloudflare", "Cloudflare"), cost: L("無料", "Free") },
    { target: "GitLab Pages", status: "active",
      url: "https://elzup.gitlab.io/ImmortaClock/",
      kind: L("repo ミラー + Pages", "repo mirror + Pages"),
      operator: L("GitLab社", "GitLab Inc."), cost: L("無料・無制限", "Free, unlimited") },
    { target: "Codeberg Pages", status: "active",
      url: "https://elzup.codeberg.page/ImmortaClock/",
      kind: L("repo ミラー + Pages", "repo mirror + Pages"),
      operator: L("非営利(独)", "Non-profit (DE)"), cost: L("無料・無制限", "Free, unlimited") }
  ];

  // --- design:used-apis: 使用 API のレガシー化リスク評価 ---
  var APIS = [
    { api: "Date / setInterval", since: "ES1 / 1997", risk: "low",
      adoption: L("全環境（言語コア）", "Universal (language core)"),
      degrade: L("代替不要。除去は後方互換上ほぼ起きない。", "No fallback needed; removal is near-impossible by back-compat.") },
    { api: "navigator.language", since: "1996", risk: "low",
      adoption: L("全ブラウザ", "All browsers"),
      degrade: L("取得不能なら英語へフォールバック。", "Falls back to English if unavailable.") },
    { api: "createElement / textContent", since: "DOM L1–L2", risk: "low",
      adoption: L("全ブラウザ（DOMコア）", "All browsers (DOM core)"),
      degrade: L("代替不要。innerHTML 非使用でXSS面も無し。", "No fallback needed; innerHTML is avoided (no XSS surface).") },
    { api: "ES5 構文 (var/function)", since: "2009", risk: "low",
      adoption: L("最も広い（ES2015の上位集合）", "Broadest (superset of ES2015 engines)"),
      degrade: L("ES5採用で実行可能エンジン集合を最大化=寿命≧(INV-SF-4)。", "ES5 maximizes the runnable-engine set, so lifespan is >= (INV-SF-4).") },
    { api: "classic <script>（非module）", since: "1995", risk: "low",
      adoption: L("全環境", "Universal"),
      degrade: L("moduleはfile://がCORSで不可。classicを選択。", "Modules are blocked on file:// by CORS, so classic is chosen.") },
    { api: "CSS system-ui フォント", since: "~2015", risk: "med",
      adoption: L("広いが普遍でない", "Wide but not universal"),
      degrade: L("-apple-system, sans-serif を後置（degradeあり）。", "Falls back to -apple-system, sans-serif (degrade).") },
    { api: "CSS clamp()", since: "2020", risk: "med",
      adoption: L("現行モダンブラウザ", "Modern browsers"),
      degrade: L("前置の固定 font-size フォールバック（degradeあり）。", "Preceding fixed font-size fallback (degrade).") },
    { api: "CSS var() カスタムプロパティ", since: "2016", risk: "med",
      adoption: L("広い", "Wide"),
      degrade: L("不対応でも既定色で可読（軽微）。", "Readable with default colors if unsupported (cosmetic).") },
    { api: "font-variant-numeric: tabular-nums", since: "2015", risk: "low",
      adoption: L("広い", "Wide"),
      degrade: L("無くても桁が揃わないだけ（軽微）。", "Just loses digit alignment if absent (cosmetic).") }
  ];

  // --- design:dev-deps: 開発時のみの依存 (配布物 index.html には非搭載) ---
  var DEV_DEPS = [
    { tool: "node:test / node:assert", use: L("テストランナーとアサーション（Node標準・追加install無し）", "Test runner & assertions (Node built-in, no install)") },
    { tool: "ceg.mjs（自作）", use: L("仕様グラフの循環・依存欠落検出・寿命ランク（CEG）", "Spec-graph cycle / missing-dep / fragility-rank checks (CEG)") },
    { tool: "fake DOM（自作 / jsdom非依存）", use: L("DOM層テスト用の最小DOM（外部依存ゼロ）", "Minimal DOM for DOM-layer tests (zero external deps)") },
    { tool: "Node.js", use: L("テスト実行環境のみ（配布物の動作には不要）", "Test execution runtime only (not needed to run the artifact)") }
  ];

  function clampYears(n) { return n < 0 ? 0 : n; }
  function isActive(layer) { return layer.status === "active"; }

  // REQ-LV-1/2/4: レイヤの残存年数。basisKey は推定根拠(kind)のみ、statusKey は依存状態。
  function computeYearsLeft(layer, now) {
    var years;
    if (layer.kind === "computable") {
      var fy = layer.failureYear(now);
      years = isFinite(fy) ? clampYears(fy - now.getUTCFullYear()) : Infinity;
    } else {
      years = layer.estimatedYears;
    }
    return { years: years, basisKey: layer.kind, statusKey: layer.status, confidence: layer.confidence || null };
  }

  // 律速レイヤを述語で抽出 (最小残存年数)
  function bindingFor(now, predicate) {
    var best = null;
    for (var i = 0; i < LAYERS.length; i++) {
      var lay = LAYERS[i];
      if (!predicate(lay)) continue;
      var r = computeYearsLeft(lay, now);
      if (r.years == null || !isFinite(r.years)) continue;
      if (best == null || r.years < best.years) best = { years: r.years, layer: lay };
    }
    return best;
  }

  // REQ-LV-5: 描画が続く実効寿命 (fatal & 依存中 & low除外)
  function effectiveLife(now) {
    return bindingFor(now, function (l) {
      return l.impact === "fatal" && isActive(l) && !(l.kind === "heuristic" && l.confidence === "low");
    });
  }
  // REQ-LV-6: 正確な地域時刻の寿命 (accuracy & 依存中)
  function accuracyLife(now) {
    return bindingFor(now, function (l) { return l.impact === "accuracy" && isActive(l); });
  }

  var api = {
    t: t, pad2: pad2, format: format, humanizeYears: humanizeYears,
    LAYERS: LAYERS, FEATURES: FEATURES, DISTRIBUTION: DISTRIBUTION, APIS: APIS, DEV_DEPS: DEV_DEPS,
    UI: UI, dateLimitYear: dateLimitYear, isActive: isActive,
    computeYearsLeft: computeYearsLeft, effectiveLife: effectiveLife, accuracyLife: accuracyLife
  };
  root.ImmortaClock = api;

  // ============================================================
  // DOM 層 (document が在る時のみ起動。テストは fake DOM を注入)
  // ============================================================
  if (typeof document === "undefined") return;

  var lang = (typeof navigator !== "undefined" && navigator.language &&
    navigator.language.toLowerCase().indexOf("ja") === 0) ? "ja" : "en";

  function severityClass(years) {
    if (years == null || !isFinite(years)) return "safe";
    if (years < 10) return "danger";
    if (years < 50) return "warn";
    return "safe";
  }
  function el(tag, text) {
    var e = document.createElement(tag);
    if (text != null) e.textContent = text;
    return e;
  }
  function badge(text, cls) {
    var b = el("span", text);
    b.className = "badge " + cls;
    return b;
  }
  function buildHead(id, cols) {
    var head = document.getElementById(id);
    head.textContent = "";
    cols.forEach(function (c) { head.appendChild(el("th", t(c, lang))); });
  }
  function yearsText(layer, r) {
    var approx = layer.kind === "heuristic" ? (lang === "en" ? "~" : "約") : "";
    return approx + humanizeYears(r.years, lang);
  }
  function basisText(r) {
    var key = r.basisKey === "computable" ? UI.basisComputable : UI.basisHeuristic;
    var s = t(key, lang);
    if (r.confidence) s += (lang === "en" ? " · " : "・") + t(UI.conf[r.confidence], lang);
    return s;
  }
  // lang 非依存にならないよう括弧も言語別 (英語UIに全角括弧を漏らさない)
  function paren(inner) { return lang === "en" ? " (" + inner + ")" : "（" + inner + "）"; }

  function statusLoc(status) {
    return status === "active" ? UI.statusActive
      : status === "escaped" ? UI.statusEscaped : UI.statusNa;
  }

  // 表1: 全レイヤ統合 (依存中→脱却→該当なし)。状態列で区別し、非activeは反実仮想を弱表示。
  function renderStack() {
    var now = new Date();
    document.getElementById("stackTitle").textContent = t(UI.stackTitle, lang);
    buildHead("stackHead", [UI.colLayer, UI.colState, UI.colKiller, UI.colYears, UI.colBasis]);
    var tbody = document.getElementById("layers");
    tbody.textContent = "";
    LAYERS.forEach(function (layer) {
      var active = isActive(layer);
      var r = computeYearsLeft(layer, now);
      var tr = document.createElement("tr");
      tr.className = active ? severityClass(r.years) : "muted";

      var tdName = el("td");
      tdName.appendChild(el("div", t(layer.label, lang)));
      var sub = active ? layer.note : (layer.aside || layer.note);
      if (sub) { var n = el("div", t(sub, lang)); n.className = "note"; tdName.appendChild(n); }
      tr.appendChild(tdName);

      var tdState = el("td");
      tdState.appendChild(badge(t(statusLoc(layer.status), lang), "state " + layer.status));
      tr.appendChild(tdState);

      tr.appendChild(el("td", t(layer.killer, lang)));
      var tdYears = el("td", yearsText(layer, r)); tdYears.className = "years"; tr.appendChild(tdYears);
      var tdBasis = el("td", basisText(r)); tdBasis.className = "basis"; tr.appendChild(tdBasis);
      tbody.appendChild(tr);
    });
  }

  // 表5: 機能別の寿命・必須度
  function renderFeatures() {
    document.getElementById("featTitle").textContent = t(UI.featTitle, lang);
    buildHead("featHead", [UI.colFeature, UI.colTier, UI.colSurvive, UI.colDeps]);
    var tbody = document.getElementById("feat");
    tbody.textContent = "";
    FEATURES.forEach(function (f) {
      var tr = document.createElement("tr");
      tr.appendChild(el("td", t(f.label, lang)));
      var tdTier = el("td");
      tdTier.appendChild(badge(t(UI.tier[f.tier], lang), "tier-" + f.tier));
      tr.appendChild(tdTier);
      tr.appendChild(el("td", t(f.survives, lang)));
      var tdDeps = el("td", f.specId + " · " + f.deps); tdDeps.className = "deps"; tr.appendChild(tdDeps);
      tbody.appendChild(tr);
    });
  }

  // 表6: 配布の冗長化
  function renderDistribution() {
    document.getElementById("distTitle").textContent = t(UI.distTitle, lang);
    buildHead("distHead", [UI.colTarget, UI.colKind, UI.colOperator, UI.colCost, UI.colStatus]);
    var tbody = document.getElementById("dist");
    tbody.textContent = "";
    DISTRIBUTION.forEach(function (d) {
      var tr = document.createElement("tr");
      var tdTarget = el("td");
      if (d.url) {
        var a = el("a", d.target);
        a.href = d.url;                       // 変数代入: 単一ファイル検査の href="http" には該当しない
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener");
        tdTarget.appendChild(a);
      } else {
        tdTarget.textContent = d.target;
      }
      tr.appendChild(tdTarget);
      tr.appendChild(el("td", t(d.kind, lang)));
      tr.appendChild(el("td", t(d.operator, lang)));
      tr.appendChild(el("td", t(d.cost, lang)));
      var tdStatus = el("td");
      tdStatus.appendChild(badge(t(UI.distStatus[d.status], lang), "dist-" + d.status));
      tr.appendChild(tdStatus);
      tbody.appendChild(tr);
    });
  }

  // 表3: 使用 API のレガシー化リスク
  function renderApis() {
    document.getElementById("apiTitle").textContent = t(UI.apiTitle, lang);
    buildHead("apiHead", [UI.colApi, UI.colSince, UI.colAdoption, UI.colRisk, UI.colDegrade]);
    var tbody = document.getElementById("api");
    tbody.textContent = "";
    APIS.forEach(function (a) {
      var tr = document.createElement("tr");
      var tdApi = el("td", a.api); tdApi.className = "api"; tr.appendChild(tdApi);
      tr.appendChild(el("td", a.since));
      tr.appendChild(el("td", t(a.adoption, lang)));
      var tdRisk = el("td", t(UI.risk[a.risk], lang)); tdRisk.className = "risk-" + a.risk; tr.appendChild(tdRisk);
      tr.appendChild(el("td", t(a.degrade, lang)));
      tbody.appendChild(tr);
    });
  }

  // 表4: 開発時依存 (配布物には非搭載)
  function renderDevDeps() {
    document.getElementById("devTitle").textContent = t(UI.devTitle, lang);
    buildHead("devHead", [UI.colTool, UI.colUse, UI.colShipped]);
    var tbody = document.getElementById("dev");
    tbody.textContent = "";
    DEV_DEPS.forEach(function (d) {
      var tr = document.createElement("tr");
      tr.appendChild(el("td", d.tool));
      tr.appendChild(el("td", t(d.use, lang)));
      var tdShipped = el("td", t(UI.shippedNo, lang)); tdShipped.className = "no"; tr.appendChild(tdShipped);
      tbody.appendChild(tr);
    });
  }

  function renderHorizons() {
    var now = new Date();
    var eff = effectiveLife(now);
    var ep = document.getElementById("effective");
    ep.textContent = "";
    if (!eff) {
      ep.appendChild(el("span", t(UI.effNone, lang)));
    } else {
      ep.appendChild(el("span", t(UI.effPrefix, lang)));
      ep.appendChild(el("strong", (lang === "en" ? "~" : "約") + humanizeYears(eff.years, lang)));
      var lim = el("span", paren(t(UI.effLim, lang) + t(eff.layer.label, lang)));
      lim.className = "lim";
      ep.appendChild(lim);
    }
    var acc = accuracyLife(now);
    var ap = document.getElementById("accuracy");
    ap.textContent = acc
      ? t(UI.accPrefix, lang) + (lang === "en" ? "~" : "約") + humanizeYears(acc.years, lang) +
        paren(t(UI.effLim, lang) + t(acc.layer.label, lang))
      : t(UI.accNone, lang);
  }

  function renderChrome() {
    document.getElementById("lang").textContent = lang === "ja" ? "EN" : "日本語";
    document.getElementById("footer").textContent = t(UI.footer, lang);
    document.documentElement.setAttribute("lang", lang);
  }

  function renderAll() {
    renderChrome(); renderHorizons();
    renderStack(); renderFeatures(); renderDistribution(); renderApis(); renderDevDeps();
  }

  function tick() { document.getElementById("clock").textContent = format(new Date()); }

  function boot() {
    var btn = document.getElementById("lang");
    if (btn.addEventListener) {
      btn.addEventListener("click", function () { lang = lang === "ja" ? "en" : "ja"; renderAll(); });
    }
    tick();
    renderAll();
    setInterval(tick, 1000);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})(
  typeof window !== "undefined" ? window
  : typeof self !== "undefined" ? self
  : typeof global !== "undefined" ? global
  : this
);
</script>
</body>
</html>
