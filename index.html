<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImmortaClock</title>
<style>
  :root {
    --fg: #1a1a1a; --bg: #f7f7f4; --muted: #6b6b6b; --line: #ddd;
    --danger: #c0392b; --warn: #b9770e; --safe: #1e7d4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem; color: var(--fg); background: var(--bg);
    font-family: system-ui, -apple-system, sans-serif; line-height: 1.5;
  }
  main { max-width: 860px; margin: 0 auto; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  h1 { font-size: 1rem; font-weight: 600; color: var(--muted); margin: 0 0 .25rem; letter-spacing: .05em; }
  #lang { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: .2rem .6rem; }
  /* clamp() 非対応ブラウザ向けに前置の固定値フォールバック (degrade) */
  #clock { font-size: 4rem; font-size: clamp(2rem, 9vw, 4.5rem); font-weight: 700; margin: 0; }
  #clock { font-variant-numeric: tabular-nums; }
  #effective { margin: .5rem 0 .25rem; font-size: 1.05rem; }
  #effective strong { color: var(--safe); }
  #effective .lim { color: var(--warn); }
  #accuracy { margin: 0 0 2rem; font-size: .9rem; color: var(--muted); }
  h2 { font-size: .95rem; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: .3rem; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: .5rem .4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td.years { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
  .danger td.years { color: var(--danger); }
  .warn td.years { color: var(--warn); }
  .safe td.years { color: var(--safe); }
  tr.unused { opacity: .55; }
  tr.unused td.years { font-style: italic; font-weight: 400; }
  .basis { font-size: .75rem; color: var(--muted); }
  .note { font-size: .78rem; color: var(--muted); margin-top: .15rem; }
  footer { margin-top: 2rem; font-size: .75rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>ImmortaClock</h1>
    <button id="lang" type="button" aria-label="language"></button>
  </div>
  <p id="clock">--------------------</p>
  <p id="effective"></p>
  <p id="accuracy"></p>
  <h2 id="tableTitle"></h2>
  <table>
    <thead><tr id="thead"></tr></thead>
    <tbody id="layers"></tbody>
  </table>
  <footer id="footer"></footer>
</main>

<script>
(function (root) {
  "use strict";

  // ============================================================
  // 純粋ロジック層 (DOM 非依存・テスト対象)
  // ============================================================

  // --- i18n (design:i18n) ---
  function t(loc, lang) {
    if (!loc) return "";
    if (loc[lang] != null) return loc[lang];
    if (loc.ja != null) return loc.ja;
    return loc.en != null ? loc.en : "";
  }
  function L(ja, en) { return { ja: ja, en: en }; }

  var UI = {
    tableTitle: L("依存スタックと寿命診断（脆い → 堅牢）", "Dependency stack & longevity (fragile → robust)"),
    colLayer: L("依存レイヤ", "Layer"),
    colKiller: L("何が壊すか", "What breaks it"),
    colYears: L("あと何年", "Years left"),
    colBasis: L("根拠", "Basis"),
    effPrefix: L("描画が続く実効寿命: ", "Effective lifespan (keeps rendering): "),
    effLim: L("律速: ", "limited by: "),
    effNone: L("律速なし（依存はすべて恒久）", "No limiter (all dependencies effectively permanent)"),
    accPrefix: L("正確な地域時刻の寿命: ", "Accurate local-time horizon: "),
    accNone: L("精度の律速なし", "No accuracy limiter"),
    basisComputable: L("計算可能", "computable"),
    basisHeuristic: L("推定", "estimated"),
    basisUnused: L("不使用", "not used"),
    conf: { low: L("信頼度低", "low conf."), medium: L("信頼度中", "med conf."), high: L("信頼度高", "high conf.") },
    footer: L(
      "単一HTMLファイル・ビルド無し・外部依存無しで動作（file:// 可）。「あと何年」は計算可能な値と推定値を区別。不使用の行は『依存していた場合の目安』。",
      "Runs as a single HTML file, no build, no external deps (works via file://). Years-left separates computable from estimated values. 'Not used' rows show the estimate if you depended on it."
    )
  };

  // --- spec:clock: 時刻整形 (Date のみ。Temporal/Intl/polyfill 不使用) ---
  function pad2(n) { return n < 10 ? "0" + n : String(n); }
  function format(date) {
    var y = date.getFullYear();
    return y + "-" + pad2(date.getMonth() + 1) + "-" + pad2(date.getDate()) +
      " " + pad2(date.getHours()) + ":" + pad2(date.getMinutes()) + ":" + pad2(date.getSeconds());
  }

  // --- spec:longevity: 年数の人間可読化 ---
  function stripZero(s) { return s.replace(/\.0$/, ""); }
  function humanizeYears(n, lang) {
    if (!isFinite(n)) return "∞";
    if (lang === "en") {
      if (n >= 1000000) return stripZero((n / 1000000).toFixed(1)) + "M yr";
      if (n >= 1000) return Math.round(n / 1000) + "k yr";
      return n + " yr";
    }
    if (n >= 10000) return stripZero((n / 10000).toFixed(1)) + "万年";
    return n + "年";
  }

  // --- design:layers: 依存レイヤの単一真実源 ---
  var DATE_MAX_MS = 8640000000000000; // new Date(±8.64e15) が有効上限
  function dateLimitYear() { return new Date(DATE_MAX_MS).getUTCFullYear(); } // TZ非依存 => 275760

  var LAYERS = [
    { id: "host", appliesNow: true, impact: "fatal", kind: "heuristic", estimatedYears: 5, confidence: "low",
      label: L("ホスティング / ファイル存在", "Hosting / file existence"),
      killer: L("課金切れ・業者終了・バックアップ喪失", "Billing lapse, provider shutdown, lost backups"),
      note: L("冗長化が鍵: オフライン複製・IPFS/Arweave・複数静的ホスト・archive.org を併用すれば、寿命は『最短』でなく『最長まで生き残るミラー』で決まる。",
             "Redundancy is key: with offline copies, IPFS/Arweave, multiple static hosts and archive.org, lifespan is set by the longest-surviving mirror, not the shortest.") },
    { id: "framework", appliesNow: false, impact: "fatal", kind: "heuristic", estimatedYears: 5, confidence: "low",
      label: L("モダンFW / ビルド / CDN", "Modern framework / build / CDN"),
      killer: L("major破壊変更・パッケージ消失", "Breaking major releases, vanished packages"),
      note: L("本実装は不使用。数値は依存した場合の目安。", "Not used here. The number is an estimate if you depended on it.") },
    { id: "leap-second", appliesNow: true, impact: "cosmetic", kind: "computable", failureYear: function () { return 2035; },
      label: L("うるう秒の廃止", "Abolition of leap seconds"),
      killer: L("IERSによるうるう秒運用の終了", "IERS ending leap-second insertion"),
      note: L("UTC定義の変更。壁掛け時計の表示には実質無影響（情報）。", "A change to UTC. Practically no effect on a wall clock (informational).") },
    { id: "time-t-2038", appliesNow: false, impact: "cosmetic", kind: "computable", failureYear: function () { return 2038; },
      label: L("符号付き32bit time_t (2038問題)", "Signed 32-bit time_t (Y2038)"),
      killer: L("time_t の桁あふれ", "time_t overflow"),
      note: L("JSは倍精度で時刻を保持するため本アプリは無関係。OS/組込み層の話（情報）。", "JS holds time as a double, so this app is unaffected. Concerns OS/embedded layers (informational).") },
    { id: "tls", appliesNow: true, impact: "cosmetic", kind: "heuristic", estimatedYears: 15, confidence: "medium",
      label: L("TLS / HTTPS", "TLS / HTTPS"),
      killer: L("旧プロトコルの廃止", "Deprecation of old protocols"),
      note: L("file:// では不要。HTTPに落ちても、読み込めれば描画は継続。", "Not needed for file://. Even falling back to HTTP, it keeps rendering once loaded.") },
    { id: "browser", appliesNow: true, impact: "fatal", kind: "heuristic", estimatedYears: 30, confidence: "medium",
      label: L("ブラウザ / JSエンジン (vanilla ES)", "Browser / JS engine (vanilla ES)"),
      killer: L("後方互換の打ち切り（歴史上ほぼ前例なし）", "Dropping backward compatibility (almost no precedent)") },
    { id: "tz", appliesNow: true, impact: "accuracy", kind: "heuristic", estimatedYears: 40, confidence: "medium",
      label: L("IANA タイムゾーンDB", "IANA time zone DB"),
      killer: L("tz更新の停止・地政学的変更", "tz updates stopping; geopolitical changes"),
      note: L("更新が止まると地域時刻がズレる（動くが不正確化）。", "If updates stop, local time drifts (it runs but grows inaccurate).") },
    { id: "time-api", appliesNow: true, impact: "fatal", kind: "heuristic", estimatedYears: 50, confidence: "high",
      label: L("時刻API (Date / Temporal)", "Time API (Date / Temporal)"),
      killer: L("Date廃止（可能性ほぼ無し）", "Removal of Date (virtually impossible)"),
      note: L("Dateは後方互換で恒久。Temporalはより新しくnative普及途上で、polyfillは依存を焼き込むため不使用。nativeにTemporalがあっても本実装はDateを維持。",
             "Date is permanent via backward compat. Temporal is newer and still rolling out; a polyfill would bake in a dependency, so it is avoided. Even with native Temporal, this app keeps Date.") },
    { id: "html", appliesNow: true, impact: "fatal", kind: "heuristic", estimatedYears: 50, confidence: "high",
      label: L("HTML / CSS 規格", "HTML / CSS standards"),
      killer: L("後方互換の文化が崩れる", "The culture of backward compatibility breaking") },
    { id: "encoding", appliesNow: true, impact: "fatal", kind: "heuristic", estimatedYears: 300, confidence: "high",
      label: L("数値・文字 (IEEE754 / Unicode)", "Numbers & text (IEEE754 / Unicode)"),
      killer: L("事実上不変", "Effectively immutable") },
    { id: "date-limit", appliesNow: true, impact: "fatal", kind: "computable", failureYear: dateLimitYear,
      label: L("JS Date 数値上限", "JS Date numeric limit"),
      killer: L("new Date(8.64e15) を超過", "Exceeding new Date(8.64e15)"),
      note: L("倍精度ミリ秒の天井。西暦 " + dateLimitYear() + " 年まで表現可能。", "Ceiling of double-precision ms. Representable until year " + dateLimitYear() + ".") },
    { id: "physical", appliesNow: true, impact: "fatal", kind: "heuristic", estimatedYears: 300, confidence: "low",
      label: L("電力・デバイス・文明", "Power, devices, civilization"),
      killer: L("物理基盤の喪失", "Loss of the physical substrate"),
      note: L("本ソフトの範囲外だが最終的な律速。The Long Now 的観点。", "Out of this software's scope, but the ultimate limiter — a Long Now perspective.") }
  ];

  function clampYears(n) { return n < 0 ? 0 : n; }

  // REQ-LV-1/2/3/7: レイヤの残存年数
  function computeYearsLeft(layer, now) {
    var years;
    if (layer.kind === "computable") {
      var fy = layer.failureYear(now);
      years = isFinite(fy) ? clampYears(fy - now.getUTCFullYear()) : Infinity;
    } else {
      years = layer.estimatedYears;
    }
    var basisKey = !layer.appliesNow ? "unused" : (layer.kind === "computable" ? "computable" : "heuristic");
    return { years: years, basisKey: basisKey, confidence: layer.confidence || null };
  }

  // 律速レイヤを述語で抽出 (最小残存年数)
  function bindingFor(now, predicate) {
    var best = null;
    for (var i = 0; i < LAYERS.length; i++) {
      var lay = LAYERS[i];
      if (!predicate(lay)) continue;
      var r = computeYearsLeft(lay, now);
      if (r.years == null || !isFinite(r.years)) continue;
      if (best == null || r.years < best.years) best = { years: r.years, layer: lay };
    }
    return best;
  }

  // REQ-LV-5: 描画が続く実効寿命 (fatal & 使用中 & low除外)
  function effectiveLife(now) {
    return bindingFor(now, function (l) {
      return l.impact === "fatal" && l.appliesNow && !(l.kind === "heuristic" && l.confidence === "low");
    });
  }
  // REQ-LV-6: 正確な地域時刻の寿命 (accuracy & 使用中)
  function accuracyLife(now) {
    return bindingFor(now, function (l) { return l.impact === "accuracy" && l.appliesNow; });
  }

  var api = {
    t: t, pad2: pad2, format: format, humanizeYears: humanizeYears,
    LAYERS: LAYERS, UI: UI, dateLimitYear: dateLimitYear,
    computeYearsLeft: computeYearsLeft, effectiveLife: effectiveLife, accuracyLife: accuracyLife
  };
  root.ImmortaClock = api;

  // ============================================================
  // DOM 層 (document が在る時のみ起動。テストは fake DOM を注入)
  // ============================================================
  if (typeof document === "undefined") return;

  var lang = (typeof navigator !== "undefined" && navigator.language &&
    navigator.language.toLowerCase().indexOf("ja") === 0) ? "ja" : "en";

  function severityClass(years) {
    if (years == null || !isFinite(years)) return "safe";
    if (years < 10) return "danger";
    if (years < 50) return "warn";
    return "safe";
  }
  function el(tag, text) {
    var e = document.createElement(tag);
    if (text != null) e.textContent = text;
    return e;
  }
  function yearsText(layer, r) {
    var approx = layer.kind === "heuristic" ? (lang === "en" ? "~" : "約") : "";
    return approx + humanizeYears(r.years, lang);
  }
  function basisText(r) {
    var key = r.basisKey === "computable" ? UI.basisComputable
      : r.basisKey === "unused" ? UI.basisUnused : UI.basisHeuristic;
    var s = t(key, lang);
    if (r.confidence) s += "・" + t(UI.conf[r.confidence], lang);
    return s;
  }

  function renderTable() {
    var now = new Date();
    document.getElementById("tableTitle").textContent = t(UI.tableTitle, lang);

    var thead = document.getElementById("thead");
    thead.textContent = "";
    [UI.colLayer, UI.colKiller, UI.colYears, UI.colBasis].forEach(function (c) {
      thead.appendChild(el("th", t(c, lang)));
    });

    var tbody = document.getElementById("layers");
    tbody.textContent = "";
    LAYERS.forEach(function (layer) {
      var r = computeYearsLeft(layer, now);
      var tr = document.createElement("tr");
      tr.className = severityClass(r.years) + (layer.appliesNow ? "" : " unused");

      var tdName = el("td");
      tdName.appendChild(el("div", t(layer.label, lang)));
      if (layer.note) { var n = el("div", t(layer.note, lang)); n.className = "note"; tdName.appendChild(n); }
      tr.appendChild(tdName);

      tr.appendChild(el("td", t(layer.killer, lang)));

      var tdYears = el("td", yearsText(layer, r));
      tdYears.className = "years";
      tr.appendChild(tdYears);

      var tdBasis = el("td", basisText(r));
      tdBasis.className = "basis";
      tr.appendChild(tdBasis);

      tbody.appendChild(tr);
    });
  }

  function renderHorizons() {
    var now = new Date();
    var eff = effectiveLife(now);
    var ep = document.getElementById("effective");
    ep.textContent = "";
    if (!eff) { ep.appendChild(el("span", t(UI.effNone, lang))); }
    else {
      ep.appendChild(el("span", t(UI.effPrefix, lang)));
      ep.appendChild(el("strong", (lang === "en" ? "~" : "約") + humanizeYears(eff.years, lang)));
      var lim = el("span", "（" + t(UI.effLim, lang) + t(eff.layer.label, lang) + "）");
      lim.className = "lim";
      ep.appendChild(lim);
    }
    var acc = accuracyLife(now);
    var ap = document.getElementById("accuracy");
    ap.textContent = acc
      ? t(UI.accPrefix, lang) + (lang === "en" ? "~" : "約") + humanizeYears(acc.years, lang) +
        "（" + t(UI.effLim, lang) + t(acc.layer.label, lang) + "）"
      : t(UI.accNone, lang);
  }

  function renderChrome() {
    document.getElementById("lang").textContent = lang === "ja" ? "EN" : "日本語";
    document.getElementById("footer").textContent = t(UI.footer, lang);
    document.documentElement.setAttribute("lang", lang);
  }

  function renderAll() { renderChrome(); renderHorizons(); renderTable(); }

  function tick() { document.getElementById("clock").textContent = format(new Date()); }

  function boot() {
    var btn = document.getElementById("lang");
    if (btn.addEventListener) {
      btn.addEventListener("click", function () { lang = lang === "ja" ? "en" : "ja"; renderAll(); });
    }
    tick();
    renderAll();
    setInterval(tick, 1000);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})(
  typeof window !== "undefined" ? window
  : typeof self !== "undefined" ? self
  : typeof global !== "undefined" ? global
  : this
);
</script>
</body>
</html>
